<title>Insurance AI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width column — reminders first, then the client list; tapping a client opens its summary sheet */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #12211f;
  --muted: #5b6b68;
  --line: #d5dedc;
  --accent: #0b6e5f;
  --accent-soft: #d8ece8;
  --warn: #9a5b00;
  --warn-soft: #fbedd6;
  --due: #b42318;
  --due-soft: #fbe2df;
  --ok: #1f7a3a;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1716; --surface: #18221f; --ink: #e6efed; --muted: #9db0ac; --line: #2a3835;
    --accent: #4cc2ad; --accent-soft: #173a34; --warn: #f0b860; --warn-soft: #3a2c14;
    --due: #ff8a7d; --due-soft: #42201c; --ok: #6fd18c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1716; --surface: #18221f; --ink: #e6efed; --muted: #9db0ac; --line: #2a3835;
  --accent: #4cc2ad; --accent-soft: #173a34; --warn: #f0b860; --warn-soft: #3a2c14;
  --due: #ff8a7d; --due-soft: #42201c; --ok: #6fd18c; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px;
  border-bottom: 1px solid var(--line);
}
h1 { font-family: var(--font-display); font-size: 1.45rem; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--accent); }
h2 { font-family: var(--font-display); font-size: 1.05rem; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 0.82rem; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
.lang button { border: 0; background: transparent; color: var(--muted); font: 600 0.8rem var(--font-body); padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.count { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); }
.remind {
  background: var(--due-soft); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;
}
.remind-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.remind strong { font-size: 0.98rem; }
.when { font-family: var(--font-mono); font-size: 0.8rem; color: var(--due); white-space: nowrap; }
.msg { background: var(--surface); border-radius: 8px; padding: 10px 12px; font-size: 0.88rem; white-space: pre-wrap; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px;
  font: 600 0.82rem var(--font-body); padding: 7px 12px; cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.empty { color: var(--muted); font-size: 0.9rem; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: 0.95rem var(--font-body); }
.list { display: flex; flex-direction: column; gap: 0; background: var(--surface); border-radius: 12px; border: 1px solid var(--line); overflow: hidden; }
.item {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; color: inherit; text-align: left; font: inherit; cursor: pointer; width: 100%;
}
.item:last-child { border-bottom: 0; }
.item:hover { background: var(--accent-soft); }
.item .name { font-weight: 600; min-width: 0; }
.item .meta { grid-column: 1 / -1; color: var(--muted); font-size: 0.84rem; min-width: 0; }
.item .amt { font-family: var(--font-mono); font-size: 0.85rem; text-align: right; font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1 / -1; margin-top: 4px; }
.chip { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.due { background: var(--due-soft); color: var(--due); }
.foot { color: var(--muted); font-size: 0.8rem; text-align: center; }

/* Detail sheet */
.sheet { display: flex; flex-direction: column; gap: 18px; }
.back { align-self: flex-start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.title-block h2 { font-size: 1.3rem; }
.kv { display: grid; grid-template-columns: minmax(0, 38%) minmax(0, 1fr); gap: 8px 12px; margin: 0; }
.kv dt { color: var(--muted); font-size: 0.86rem; }
.kv dd { margin: 0; font-size: 0.92rem; min-width: 0; }
.label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
ul.plain { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; }
.flag { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 8px 10px; font-size: 0.88rem; }
.flag b { color: var(--warn); }
.date-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding-block: 8px; border-top: 1px solid var(--line); }
.date-row:first-of-type { border-top: 0; }
.date-row .d { font-family: var(--font-mono); font-size: 0.88rem; }
.date-row .src { grid-column: 1 / -1; font-size: 0.78rem; color: var(--muted); }
.date-edit { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
.date-edit input { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 6px 8px; font: 0.9rem var(--font-body); }
.notstated { color: var(--warn); font-weight: 600; }
a { color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .item, .btn { transition: background-color .15s; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Insurance <span>AI</span></h1>
      <div class="sub" id="tagline"></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-bm" aria-pressed="false">BM</button>
    </div>
  </header>

  <main id="home" class="wrap" style="gap:22px">
    <section class="section" aria-labelledby="rem-h">
      <div class="section-head"><h2 id="rem-h"></h2><span class="count" id="rem-count"></span></div>
      <div id="reminders"></div>
    </section>
    <section class="section" aria-labelledby="list-h">
      <div class="section-head"><h2 id="list-h"></h2><span class="count" id="list-count"></span></div>
      <input id="q" class="search" type="search" autocomplete="off">
      <div id="list"></div>
    </section>
    <p class="foot" id="lastrun"></p>
  </main>

  <main id="detail" class="sheet" hidden></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const T = {
  en: {
    tagline: "Quotation & policy summaries", reminders: "Reminders · next 3 days", noRem: "Nothing due in the next 3 days.",
    clients: "Clients", search: "Search client, plan or insurer", loading: "Loading summaries…",
    empty: "No summaries yet. The daily 8:00 am check reads your Drive folder “2. Policy Review” and adds each new PDF here.",
    slow: "Can't reach the saved summaries yet. Check your connection; this page updates by itself once it loads.",
    lastRun: "Last Drive check", never: "Drive not checked yet",
    copyEn: "Copy message", copied: "Copied", back: "← All clients", openPdf: "Open PDF in Drive",
    overview: "At a glance", protection: "Protection coverage", premium: "Premium", waiting: "Waiting period",
    exclusions: "Key exclusions", notes: "Other key points", flags: "Check before you share",
    dates: "Reminder dates", notStated: "Not stated", fromPdf: "From the PDF", fromYou: "Entered by you",
    addDate: "Add date", save: "Save", clear: "Remove", saved: "Date saved", saveFail: "Couldn't save. Try again.",
    quoteValidUntil: "Quotation valid until", premiumDue: "Next premium due", policyExpiry: "Policy expiry / renewal",
    today: "today", tomorrow: "tomorrow", inDays: n => `in ${n} days`, passed: "passed",
    verify: "Verify", quotation: "Quotation", policy: "Policy", other: "Document", dueSoon: "Due soon", missing: n => `${n} date${n===1?"":"s"} missing`,
    client: "Client", plan: "Plan", insurer: "Insurer", sum: "Sum insured", file: "File", nameInPdf: "Name in PDF",
    msg: {
      quoteValidUntil: (c,p,d) => `Hi ${c}, a quick reminder that your ${p} quotation is valid until ${d}. Let me know if you have any questions or would like to proceed.`,
      premiumDue: (c,p,d,a) => `Hi ${c}, a friendly reminder that your ${p} premium${a?` of ${a}`:""} is due on ${d}.`,
      policyExpiry: (c,p,d) => `Hi ${c}, your ${p} policy is due for renewal on ${d}. I can help you review your coverage before then.`
    }
  },
  bm: {
    tagline: "Ringkasan sebut harga & polisi", reminders: "Peringatan · 3 hari akan datang", noRem: "Tiada apa-apa yang perlu dalam 3 hari akan datang.",
    clients: "Pelanggan", search: "Cari pelanggan, pelan atau syarikat", loading: "Memuatkan ringkasan…",
    empty: "Belum ada ringkasan. Semakan harian 8:00 pagi membaca folder Drive “2. Policy Review” dan menambah setiap PDF baharu di sini.",
    slow: "Ringkasan belum dapat dicapai. Semak sambungan anda; halaman ini dikemas kini sendiri apabila dimuatkan.",
    lastRun: "Semakan Drive terakhir", never: "Drive belum disemak",
    copyEn: "Salin mesej", copied: "Disalin", back: "← Semua pelanggan", openPdf: "Buka PDF dalam Drive",
    overview: "Sepintas lalu", protection: "Perlindungan", premium: "Premium", waiting: "Tempoh menunggu",
    exclusions: "Pengecualian utama", notes: "Perkara penting lain", flags: "Semak sebelum berkongsi",
    dates: "Tarikh peringatan", notStated: "Tidak dinyatakan", fromPdf: "Daripada PDF", fromYou: "Dimasukkan oleh anda",
    addDate: "Tambah tarikh", save: "Simpan", clear: "Buang", saved: "Tarikh disimpan", saveFail: "Tidak dapat disimpan. Cuba lagi.",
    quoteValidUntil: "Sebut harga sah sehingga", premiumDue: "Premium seterusnya", policyExpiry: "Tamat / pembaharuan polisi",
    today: "hari ini", tomorrow: "esok", inDays: n => `dalam ${n} hari`, passed: "telah lepas",
    verify: "Semak", quotation: "Sebut harga", policy: "Polisi", other: "Dokumen", dueSoon: "Hampir tiba", missing: n => `${n} tarikh tiada`,
    client: "Pelanggan", plan: "Pelan", insurer: "Syarikat", sum: "Jumlah diinsuranskan", file: "Fail", nameInPdf: "Nama dalam PDF",
    msg: {
      quoteValidUntil: (c,p,d) => `Hai ${c}, peringatan ringkas bahawa sebut harga ${p} anda sah sehingga ${d}. Beritahu saya jika ada sebarang soalan atau ingin meneruskan.`,
      premiumDue: (c,p,d,a) => `Hai ${c}, peringatan mesra bahawa premium ${p} anda${a?` sebanyak ${a}`:""} perlu dibayar pada ${d}.`,
      policyExpiry: (c,p,d) => `Hai ${c}, polisi ${p} anda akan diperbaharui pada ${d}. Saya boleh bantu semak perlindungan anda sebelum tarikh itu.`
    }
  }
};
const DATE_KEYS = ["quoteValidUntil", "premiumDue", "policyExpiry"];
let lang = "en";
try { if (localStorage.getItem("iai-lang") === "bm") lang = "bm"; } catch (e) {}
let docs = [];         // [{id, ...data}]
let lastRun = null;
let loaded = false, slow = false;
let openId = null;
let dbRef = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function todayMY() {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kuala_Lumpur" }).format(new Date());
  return new Date(p + "T00:00:00Z");
}
function parseD(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || "") ? new Date(s + "T00:00:00Z") : null; }
function fmtD(d) { return d.toLocaleDateString(lang === "bm" ? "ms-MY" : "en-GB", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); }
function daysFrom(d) { return Math.round((d - todayMY()) / 86400000); }
// Monthly / yearly premiums roll forward so the reminder always points at the next due date.
function effectiveDate(doc, key) {
  let d = parseD(doc.dates?.[key]);
  if (!d || key !== "premiumDue") return d;
  const step = { monthly: 1, quarterly: 3, "half-yearly": 6, annual: 12, yearly: 12 }[(doc.premiumMode || "").toLowerCase()];
  if (!step) return d;
  const t = todayMY();
  let guard = 0;
  while (d < t && guard++ < 1200) { d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + step, d.getUTCDate())); }
  return d;
}
function whenText(n) { const L = T[lang]; return n < 0 ? L.passed : n === 0 ? L.today : n === 1 ? L.tomorrow : L.inDays(n); }
function sumOf(doc) { return doc.sumInsured || ""; }
function S(doc) { return (lang === "bm" ? doc.bm : doc.en) || doc.en || {}; }

function reminders() {
  const out = [];
  for (const doc of docs) for (const k of DATE_KEYS) {
    const d = effectiveDate(doc, k);
    if (!d) continue;
    const n = daysFrom(d);
    if (n >= 0 && n <= 3) out.push({ doc, key: k, d, n });
  }
  return out.sort((a, b) => a.n - b.n);
}
function clientMsg(r, l) {
  const L = T[l];
  const d = r.d.toLocaleDateString(l === "bm" ? "ms-MY" : "en-GB", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  return L.msg[r.key](r.doc.client || "", r.doc.plan || "", d, r.doc.premium || "");
}

function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1800); }
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); toast(T[lang].copied); }
  catch (e) {
    const box = btn.closest(".remind")?.querySelector(".msg");
    if (box) { const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }
}

function renderHome() {
  const L = T[lang];
  $("tagline").textContent = L.tagline;
  $("rem-h").textContent = L.reminders;
  $("list-h").textContent = L.clients;
  $("q").placeholder = L.search;
  const rems = reminders();
  $("rem-count").textContent = loaded ? String(rems.length) : "";
  $("reminders").innerHTML = !loaded ? `<div class="empty">${esc(slow ? L.slow : L.loading)}</div>`
    : rems.length === 0 ? `<div class="empty">${esc(L.noRem)}</div>`
    : rems.map((r, i) => `
      <div class="remind" style="margin-bottom:8px">
        <div class="remind-top"><strong>${esc(r.doc.client)}</strong><span class="when">${esc(whenText(r.n))} · ${esc(fmtD(r.d))}</span></div>
        <div class="sub">${esc(L[r.key])} — ${esc(r.doc.plan || "")}</div>
        <div class="msg">${esc(clientMsg(r, lang))}</div>
        <div class="row-actions">
          <button class="btn primary" data-copy="${i}">${esc(L.copyEn)}</button>
          <button class="btn" data-open="${esc(r.doc.id)}">${esc(L.overview)}</button>
        </div>
      </div>`).join("");
  $("reminders").querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(clientMsg(rems[+b.dataset.copy], lang), b));
  $("reminders").querySelectorAll("[data-open]").forEach(b => b.onclick = () => openDetail(b.dataset.open));

  const q = $("q").value.trim().toLowerCase();
  const shown = docs.filter(d => !q || [d.client, d.plan, d.insurer, d.fileName].join(" ").toLowerCase().includes(q))
    .sort((a, b) => (a.client || "").localeCompare(b.client || ""));
  $("list-count").textContent = loaded ? String(docs.length) : "";
  const dueIds = new Set(rems.map(r => r.doc.id));
  $("list").innerHTML = !loaded ? "" : docs.length === 0 ? `<div class="empty">${esc(L.empty)}</div>`
    : `<div class="list">${shown.map(d => {
        const missing = DATE_KEYS.filter(k => !d.dates?.[k]).length;
        return `<button class="item" data-open="${esc(d.id)}">
          <span class="name">${esc(d.client)}</span><span class="amt">${esc(sumOf(d))}</span>
          <span class="meta">${esc([d.insurer, d.plan].filter(Boolean).join(" · "))}</span>
          <span class="chips">
            <span class="chip">${esc(L[d.docType] || L.other)}</span>
            ${dueIds.has(d.id) ? `<span class="chip due">${esc(L.dueSoon)}</span>` : ""}
            ${d.status === "verify" ? `<span class="chip warn">${esc(L.verify)}</span>` : ""}
            ${missing ? `<span class="chip warn">${esc(L.missing(missing))}</span>` : ""}
          </span>
        </button>`; }).join("")}</div>`;
  $("list").querySelectorAll("[data-open]").forEach(b => b.onclick = () => openDetail(b.dataset.open));

  $("lastrun").textContent = lastRun?.at
    ? `${L.lastRun}: ${new Date(lastRun.at).toLocaleString(lang === "bm" ? "ms-MY" : "en-GB", { dateStyle: "medium", timeStyle: "short", timeZone: "Asia/Kuala_Lumpur" })}`
    : (loaded ? L.never : "");
}

function list(items) { return items?.length ? `<ul class="plain">${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<span class="notstated">${esc(T[lang].notStated)}</span>`; }
function txt(v) { return v ? esc(v) : `<span class="notstated">${esc(T[lang].notStated)}</span>`; }

function renderDetail() {
  const doc = docs.find(d => d.id === openId);
  const el = $("detail");
  if (!doc) { closeDetail(); return; }
  const L = T[lang], s = S(doc);
  el.innerHTML = `
    <button class="btn back" id="back">${esc(L.back)}</button>
    <div class="title-block">
      <div class="label">${esc(L[doc.docType] || L.other)}${doc.status === "verify" ? " · " + esc(L.verify) : ""}</div>
      <h2>${esc(doc.client)}</h2>
      <div class="sub">${esc([doc.insurer, doc.plan].filter(Boolean).join(" · "))}</div>
    </div>
    ${(s.flags || []).length ? `<div class="card"><div class="label">${esc(L.flags)}</div>${s.flags.map(f => `<div class="flag"><b>!</b> ${esc(f)}</div>`).join("")}</div>` : ""}
    <div class="card">
      <div class="label">${esc(L.overview)}</div>
      <dl class="kv">
        <dt>${esc(L.client)}</dt><dd>${esc(doc.client)}</dd>
        ${doc.nameInPdf && doc.nameInPdf !== doc.client ? `<dt>${esc(L.nameInPdf)}</dt><dd>${esc(doc.nameInPdf)}</dd>` : ""}
        <dt>${esc(L.insurer)}</dt><dd>${txt(doc.insurer)}</dd>
        <dt>${esc(L.plan)}</dt><dd>${txt(doc.plan)}</dd>
        <dt>${esc(L.sum)}</dt><dd>${txt(doc.sumInsured)}</dd>
        <dt>${esc(L.premium)}</dt><dd>${txt(doc.premium)}</dd>
      </dl>
      ${s.overview ? `<div style="font-size:.92rem">${esc(s.overview)}</div>` : ""}
    </div>
    <div class="card">
      <div class="label">${esc(L.protection)}</div>
      ${(s.protection || []).length ? `<dl class="kv">${s.protection.map(p => `<dt>${esc(p.label)}</dt><dd>${esc(p.value)}</dd>`).join("")}</dl>` : txt("")}
    </div>
    <div class="card"><div class="label">${esc(L.premium)}</div><div style="font-size:.92rem">${txt(s.premium)}</div></div>
    <div class="card"><div class="label">${esc(L.waiting)}</div><div style="font-size:.92rem">${txt(s.waiting)}</div></div>
    <div class="card"><div class="label">${esc(L.exclusions)}</div>${list(s.exclusions)}</div>
    ${(s.notes || []).length ? `<div class="card"><div class="label">${esc(L.notes)}</div>${list(s.notes)}</div>` : ""}
    <div class="card">
      <div class="label">${esc(L.dates)}</div>
      ${DATE_KEYS.map(k => {
        const raw = doc.dates?.[k], d = effectiveDate(doc, k), n = d ? daysFrom(d) : null;
        const src = doc.dateSource?.[k] === "you" ? L.fromYou : raw ? L.fromPdf : "";
        return `<div class="date-row">
          <span>${esc(L[k])}</span>
          <span class="d">${d ? `${esc(fmtD(d))} <span class="sub">(${esc(whenText(n))})</span>` : `<span class="notstated">${esc(L.notStated)}</span>`}</span>
          ${src ? `<span class="src">${esc(src)}</span>` : ""}
          <div class="date-edit">
            <input type="date" id="date-${k}" value="${esc(raw || "")}" aria-label="${esc(L[k])}">
            <button class="btn" data-save="${k}">${esc(raw ? L.save : L.addDate)}</button>
            ${raw ? `<button class="btn" data-clear="${k}">${esc(L.clear)}</button>` : ""}
          </div>
        </div>`; }).join("")}
    </div>
    ${doc.fileUrl ? `<a href="${esc(doc.fileUrl)}" target="_blank" rel="noopener">${esc(L.openPdf)}</a> <span class="sub">· ${esc(doc.folder || "")} / ${esc(doc.fileName || "")}</span>` : ""}
  `;
  $("back").onclick = closeDetail;
  el.querySelectorAll("[data-save]").forEach(b => b.onclick = () => saveDate(doc.id, b.dataset.save, $("date-" + b.dataset.save).value || null));
  el.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => saveDate(doc.id, b.dataset.clear, null));
}

async function saveDate(id, key, value) {
  if (!dbRef) { toast(T[lang].saveFail); return; }
  try {
    await dbRef.doc("policies/" + id).update({ dates: { [key]: value }, dateSource: { [key]: value ? "you" : null } });
    toast(T[lang].saved);
  } catch (e) { toast(T[lang].saveFail); }
}

function openDetail(id) { openId = id; $("home").hidden = true; $("detail").hidden = false; renderDetail(); window.scrollTo(0, 0); }
function closeDetail() { openId = null; $("detail").hidden = true; $("home").hidden = false; renderHome(); }
function render() { renderHome(); if (openId) renderDetail(); }

function setLang(l) {
  lang = l;
  try { localStorage.setItem("iai-lang", l); } catch (e) {}
  $("lang-en").setAttribute("aria-pressed", String(l === "en"));
  $("lang-bm").setAttribute("aria-pressed", String(l === "bm"));
  document.documentElement.lang = l === "bm" ? "ms" : "en";
  render();
}
$("lang-en").onclick = () => setLang("en");
$("lang-bm").onclick = () => setLang("bm");
$("q").addEventListener("input", renderHome);
setLang(lang);

(async () => {
  const timer = setTimeout(() => { slow = true; render(); }, 10000);
  const db = window.claude ? await window.claude.use("db") : null;
  if (!db) { clearTimeout(timer); slow = true; render(); return; }
  dbRef = db;
  db.collection("policies").onSnapshot(snap => {
    docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { clearTimeout(timer); slow = false; }
    loaded = true; render();
  }, () => { clearTimeout(timer); loaded = true; render(); });
  db.doc("meta/lastRun").onSnapshot(s => { lastRun = s.exists ? s.data() : null; renderHome(); }, () => {});
})();
</script>
